name: Build LocusPlusV2 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail

          XCODE="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 26.6 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE"

          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install

      - name: Build Vite web app
        run: |
          set -euo pipefail
          npm run build

          test -d dist
          echo "Web build created:"
          du -sh dist

      - name: Install Capacitor
        run: |
          set -euo pipefail

          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Create Capacitor configuration
        run: |
          set -euo pipefail

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.chrismack.locus',
            appName: 'Locus',
            webDir: 'dist',
            server: {
              iosScheme: 'capacitor'
            }
          };

          export default config;
          EOF

          cat capacitor.config.ts

      - name: Add iOS platform
        run: |
          set -euo pipefail

          rm -rf ios

          npx cap add ios

      - name: Sync web app into iOS
        run: |
          set -euo pipefail

          npx cap sync ios

      - name: Set iOS deployment target
        run: |
          set -euo pipefail

          find ios -name "*.pbxproj" -print

          PBX="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -f "$PBX" ]; then
            echo "::error::Xcode project not found"
            exit 1
          fi

          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]*/IPHONEOS_DEPLOYMENT_TARGET = 18.0/g' "$PBX"

      - name: Show Xcode project
        run: |
          set -euo pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -list

      - name: Build unsigned iOS app
        run: |
          set -o pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Find application
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP" ]; then
            echo "::error::App.app was not created"

            find build/Build/Products -maxdepth 4 -print || true

            exit 1
          fi

          echo "Found:"
          du -sh "$APP"

      - name: Rename application
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphoneos/App.app"

          mv "$APP" "build/Build/Products/Release-iphoneos/Locus.app"

      - name: Create IPA
        run: |
          set -euo pipefail

          rm -rf Payload
          mkdir Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/Locus.app" \
            "Payload/Locus.app"

          rm -f LocusPlusV2-unsigned.ipa

          zip -qry \
            LocusPlusV2-unsigned.ipa \
            Payload

          test -f LocusPlusV2-unsigned.ipa

          echo "IPA:"
          ls -lh LocusPlusV2-unsigned.ipa

      - name: Verify IPA
        run: |
          set -euo pipefail

          unzip -t LocusPlusV2-unsigned.ipa

          echo
          echo "IPA contents:"
          unzip -l LocusPlusV2-unsigned.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlusV2-unsigned-IPA
          path: LocusPlusV2-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlusV2-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
